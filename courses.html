<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass - Courses</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand">
        <img src="assets/logo.png" alt="Compass logo" class="navbar__logo" />
        <span class="navbar__title">Compass</span>
    </a>

    <nav class="navbar__links">
      <a href="ap-scores.html">AP Scores</a>
      <a href="deadlines.html">Deadlines</a>
      <a href="courses.html">Courses</a>
    </nav>
  </header>

  <main class="page">
    <div class="container">
      <section class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 class="card__title" style="margin:0;">Courses by Priority</h2>
          <div>
            <strong># of Campuses</strong>
            <span style="margin-left:8px;" data-role="campus-count">0</span>
          </div>
        </div>

        <p class="muted">
          Showing courses from
          <strong data-role="from-institution">College of San Mateo</strong>
          that are transferable and required across the schools/majors you saved
          on the Deadlines page. Higher-priority courses count toward more
          schools.
        </p>

        <div class="form-row" style="flex-direction:row; gap:12px; margin: 12px 0;">
          <button class="btn" data-role="refresh-btn">Force refresh</button>
          <span class="muted" data-role="overlap-status"></span>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Title</th>
                <th>Tags</th>
                <th>Schools</th>
              </tr>
            </thead>
            <tbody data-role="overlap-tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/courses.js"></script>
</body>
</html>
