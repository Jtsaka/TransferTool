<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass - Deadlines</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand">
        <img src="assets/logo.png" alt="Compass logo" class="navbar__logo" />
        <span class="navbar__title">Compass</span>
    </a>

    <nav class="navbar__links">
      <a href="ap-scores.html">AP Scores</a>
      <a href="deadlines.html">Deadlines</a>
      <a href="courses.html">Courses</a>
    </nav>
  </header>

  <main class="page">
    <div class="container stack-lg">
      <section class="card">
        <div class="form-row">
          <select class="select" data-role="school-select">
            <option value="">School/University</option>
          </select>

          <select class="select" data-role="major-select">
            <option value="">Major</option>
          </select>

          <select class="select" data-role="term-select">
            <option value="">Season, Year</option>
          </select>

          <button class="btn btn--full" data-role="add-btn">Add to list</button>
          <span class="muted" data-role="deadline-status"></span>
        </div>
      </section>

      <section class="card">
        <h2 class="card__title">Your List</h2>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>School</th>
                <th>Major</th>
                <th>Term</th>
                <th>Deadline</th>
                <th></th>
              </tr>
            </thead>
            <tbody data-role="deadline-tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/deadlines.js"></script>
</body>
</html>
