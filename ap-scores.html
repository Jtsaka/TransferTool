<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass - AP Scores</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="navbar__brand">
        <img src="assets/logo.png" alt="Compass logo" class="navbar__logo" />
        <span class="navbar__title">Compass</span>
    </a>

    <nav class="navbar__links">
      <a href="ap-scores.html">AP Scores</a>
      <a href="deadlines.html">Deadlines</a>
      <a href="courses.html">Courses</a>
    </nav>
  </header>

  <main class="page">
    <div class="container stack-lg">
      <section class="card">
        <div class="grid-2">
          <select class="select" data-role="school-select">
            <option value="">Select School/University</option>
          </select>

          <select class="select" data-role="major-select">
            <option value="">Select Major</option>
          </select>
        </div>

        <div class="form-row" style="flex-direction:row; gap:12px; margin-top:12px;">
          <button class="btn" data-role="lookup-btn">Look up</button>
          <button class="btn" data-role="refresh-btn">Force refresh</button>
          <span class="muted" data-role="ap-status"></span>
        </div>
      </section>

      <section class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>AP Subject</th>
              <th>Score Accepted</th>
              <th>Units</th>
              <th>Course / Requirement</th>
              <th>School</th>
            </tr>
          </thead>
          <tbody data-role="ap-tbody">
            <tr><td colspan="5" class="muted">Pick a school and major above to load AP credit policy.</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h2 class="card__title">Notes</h2>
        <p data-role="ap-notes" class="muted">No notes loaded yet.</p>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ap-scores.js"></script>
</body>
</html>
